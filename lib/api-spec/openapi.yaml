openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: zara
    description: Zara AI assistant operations
  - name: repair
    description: Safe Zara diagnostics and isolated repair candidates
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /repair/incidents:
    post:
      operationId: createRepairIncident
      tags: [repair]
      summary: Submit a sanitized Zara diagnostic incident
      description: Accepts allowlisted diagnostic metadata only; raw audio, transcripts, request bodies, and credentials are not accepted.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepairIncidentRequest"
      responses:
        "201":
          description: Incident classified and recorded
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepairIncidentResponse"
        "400":
          description: Invalid or unsafe diagnostic payload
        "413":
          description: Diagnostic payload is too large
        "429":
          description: Diagnostic reporting rate limit reached
        "503":
          description: A trusted client IP could not be determined
  /repair/candidates:
    post:
      operationId: createRepairCandidate
      tags: [repair]
      summary: Validate a repair patch in an isolated Git worktree
      description: Requires a private worker bearer token. Creates a tagged restore point and candidate branch; never merges or deploys the candidate.
      security:
        - RepairWorkerBearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RepairCandidateRequest"
      responses:
        "202":
          description: Candidate validation started
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepairIncidentResponse"
        "400":
          description: Invalid candidate request
        "401":
          description: Worker authentication failed
        "403":
          description: Incident component is outside the health-route-only repair policy
        "404":
          description: Incident does not exist
        "409":
          description: Another candidate validation is running
        "503":
          description: Repair worker is not configured
  /repair/incidents/{id}:
    get:
      operationId: getRepairIncident
      tags: [repair]
      summary: Read a repair candidate status
      security:
        - RepairWorkerBearer: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Current incident and candidate status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RepairIncidentResponse"
        "401":
          description: Worker authentication failed
        "404":
          description: Incident does not exist
        "503":
          description: Repair worker is not configured
  /zara/chat:
    post:
      operationId: zaraChat
      tags: [zara]
      summary: Generate a Zara assistant response
      description: Sends a conversation turn to the configured server-side AI provider.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ZaraChatRequest"
      responses:
        "200":
          description: Generated assistant response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ZaraChatResponse"
        "400":
          description: Invalid request
        "502":
          description: AI provider request failed
        "503":
          description: AI provider is not configured
  /zara/weather:
    post:
      operationId: zaraWeather
      tags: [zara]
      summary: Get current weather for a place
      description: Resolves a user-provided place or coordinates and returns current weather from Open-Meteo.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ZaraWeatherRequest"
      responses:
        "200":
          description: Current weather and today's forecast
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ZaraWeatherResponse"
        "400":
          description: A place or valid coordinates are required
        "502":
          description: The weather provider could not be reached
  /zara/transcribe:
    post:
      operationId: zaraTranscribe
      tags: [zara]
      summary: Transcribe a Zara voice recording
      description: Converts a phone microphone recording to text using the configured server-side AI provider.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ZaraTranscribeRequest"
      responses:
        "200":
          description: Recognized speech
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ZaraTranscribeResponse"
        "400":
          description: Invalid recording
        "422":
          description: No speech recognized
        "502":
          description: Speech provider request failed
        "503":
          description: Speech provider is not configured
  /zara/speak:
    post:
      operationId: zaraSpeak
      tags: [zara]
      summary: Generate Zara speech audio
      description: Converts a Zara text response to Hungarian speech through the secure server-side ElevenLabs connection.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ZaraSpeakRequest"
      responses:
        "200":
          description: Generated speech audio
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ZaraSpeakResponse"
        "400":
          description: Invalid speech request
        "502":
          description: ElevenLabs request failed
        "503":
          description: ElevenLabs is not configured
components:
  securitySchemes:
    RepairWorkerBearer:
      type: http
      scheme: bearer
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    RepairEndpoint:
      type: string
      enum:
        - /api/healthz
        - /api/zara/chat
        - /api/zara/weather
        - /api/zara/transcribe
        - /api/zara/speak
    RepairEvent:
      type: object
      additionalProperties: false
      properties:
        phase:
          type: string
          enum: [before, after, error]
        endpoint:
          $ref: "#/components/schemas/RepairEndpoint"
        method:
          type: string
          enum: [GET, POST]
        status:
          type: integer
          minimum: 100
          maximum: 599
          nullable: true
        durationMs:
          type: integer
          minimum: 0
          maximum: 300000
      required: [phase, endpoint, method]
    RepairIncidentRequest:
      type: object
      additionalProperties: false
      properties:
        source:
          type: string
          enum: [mobile, api]
          default: mobile
        errorCode:
          type: string
          minLength: 1
          maxLength: 64
          pattern: "^[a-zA-Z0-9_.:-]+$"
        endpoint:
          $ref: "#/components/schemas/RepairEndpoint"
        method:
          type: string
          enum: [GET, POST]
        status:
          type: integer
          minimum: 100
          maximum: 599
        durationMs:
          type: integer
          minimum: 0
          maximum: 300000
        appVersion:
          type: string
          maxLength: 40
          pattern: "^[a-zA-Z0-9.+_-]*$"
        requestId:
          type: string
          maxLength: 80
          pattern: "^[a-zA-Z0-9_-]*$"
        events:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/RepairEvent"
      required: [errorCode]
    RepairCandidateRequest:
      type: object
      additionalProperties: false
      properties:
        incidentId:
          type: string
          format: uuid
        patch:
          type: string
          minLength: 1
          maxLength: 65536
      required: [incidentId, patch]
    RepairComponent:
      type: string
      enum:
        - microphone
        - speech-recognition
        - text-to-speech
        - wake-word
        - audio-signal
        - api-connection
        - server-health
        - unknown
    RepairSeverity:
      type: string
      enum: [low, medium, high]
    RepairState:
      type: string
      enum:
        - diagnosed
        - candidate-running
        - candidate-ready
        - candidate-failed
    RepairTestResult:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
        passed:
          type: boolean
        detail:
          type: string
      required: [name, passed]
    RepairIncidentResponse:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time
        component:
          $ref: "#/components/schemas/RepairComponent"
        confidence:
          type: number
          minimum: 0
          maximum: 1
        severity:
          $ref: "#/components/schemas/RepairSeverity"
        summaryHu:
          type: string
        nextStepHu:
          type: string
        state:
          $ref: "#/components/schemas/RepairState"
        candidateRef:
          type: string
        checkpointRef:
          type: string
        tests:
          type: array
          items:
            $ref: "#/components/schemas/RepairTestResult"
        messageHu:
          type: string
      required:
        - id
        - createdAt
        - component
        - confidence
        - severity
        - summaryHu
        - nextStepHu
        - state
        - messageHu
    ZaraChatMessage:
      type: object
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string
      required:
        - role
        - content
    ZaraChatRequest:
      type: object
      properties:
        messages:
          type: array
          minItems: 1
          maxItems: 40
          items:
            $ref: "#/components/schemas/ZaraChatMessage"
        language:
          type: string
          enum: [en, hu]
        responseStyle:
          type: string
          enum: [focused, warm, technical]
        ownerName:
          type: string
          maxLength: 120
        ownerVerified:
          type: boolean
      required:
        - messages
        - language
        - responseStyle
    ZaraChatResponse:
      type: object
      properties:
        message:
          type: string
      required:
        - message
    ZaraWeatherRequest:
      type: object
      properties:
        query:
          type: string
          maxLength: 400
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
      required: []
    ZaraWeatherResponse:
      type: object
      properties:
        message:
          type: string
        location:
          type: string
        latitude:
          type: number
        longitude:
          type: number
        temperatureC:
          type: number
        condition:
          type: string
        windSpeedKmh:
          type: number
        todayHighC:
          type: number
        todayLowC:
          type: number
        precipitationProbability:
          type: number
      required:
        - message
        - location
        - latitude
        - longitude
        - temperatureC
        - condition
        - windSpeedKmh
    ZaraTranscribeRequest:
      type: object
      properties:
        audioBase64:
          type: string
        mimeType:
          type: string
        language:
          type: string
          enum: [en, hu]
      required:
        - audioBase64
        - mimeType
        - language
    ZaraTranscribeResponse:
      type: object
      properties:
        transcript:
          type: string
      required:
        - transcript
    ZaraSpeakRequest:
      type: object
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 5000
        language:
          type: string
          enum: [en, hu]
      required:
        - text
        - language
    ZaraSpeakResponse:
      type: object
      properties:
        audioBase64:
          type: string
        mimeType:
          type: string
      required:
        - audioBase64
        - mimeType

